name: Go CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Runs on push to the master branch
  pull_request:
    branches: [ "master" ] # Runs on any pull request targeting master
  workflow_dispatch: # Allows manual trigger from the GitHub UI

env:
  # Define the name of your executable
  SERVICE_NAME: "corm-service" 
  # Set the Go version for the entire workflow
  GO_VERSION: '1.23'
  # Docker image name (replace 'your-docker-username' with your actual username/org)
  IMAGE_NAME: emillium/corm-service

jobs:
  # ---------------------------------
  # Stage 1: Lint and Test
  # ---------------------------------
  lint-test:
    name: Lint, Test, and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Optional: specify version if needed
          version: latest 

      - name: Run Linters (Static Analysis)
        run: |
          # The -v flag reports formatting errors
          go fmt ./...
          go vet ./...
          golangci-lint run
        
      - name: Run Tests with Coverage and Race Detector
        # The -race flag is critical for finding concurrency bugs
        # The -coverprofile generates the coverage report
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # ---------------------------------
  # Stage 2: Build Binary and Containerize
  # ---------------------------------
  build-and-push:
    name: Build & Push Docker Image
    # Only run this stage if the lint-test stage passed
    needs: lint-test
    # Only run on pushes to 'master' (not on PRs)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        # Requires DOCKER_USERNAME and DOCKER_PASSWORD secrets in GitHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Tag Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long # e.g., latest-e1e360e
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use a Dockerfile that implements a multi-stage build (see below)
          file: ./Dockerfile
          # Build arguments to inject version info into the binary
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ github.sha }} 
            SERVICE_NAME=${{ env.SERVICE_NAME }}
